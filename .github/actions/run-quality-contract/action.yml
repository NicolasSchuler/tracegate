# Composite action: shared quality contract used by CI.
# Encapsulates the full uv + just bootstrap so the workflow stays DRY.
# Runs `just quality`, whose direct dependencies are `check`, `lint-evals`,
# `coverage-no-regression`, `baseline-boundary-coverage`, `deps`, `audit`,
# `docs-check`, `dead-code`, `complexity`, `complexity-gate`, `security`,
# `type-coverage-strict`, and `dependency-sync`.
name: Run Quality Contract
description: Bootstrap uv/Python and run the shared local quality contract.

inputs:
  python-version:
    description: Python version to install and use for the quality contract.
    required: false
    default: "3.13"
  run-diff-coverage:
    description: Whether to run diff coverage after the main quality contract.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@v4
      with:
        enable-cache: true

    - name: Install just
      uses: taiki-e/install-action@just

    - name: Set up Python ${{ inputs.python-version }}
      shell: bash
      run: uv python install "${{ inputs.python-version }}"

    - name: Verify Python version
      shell: bash
      run: uv run --python "${{ inputs.python-version }}" python -c "import sys; print(sys.version)"

    - name: Install dependencies
      shell: bash
      run: uv sync --group dev --python "${{ inputs.python-version }}"

    # `check` expands to lint + typecheck + tests with the 95% coverage floor.
    # The other direct dependencies are listed in the action header above.
    - name: Run local quality contract
      shell: bash
      run: PYTHON_VERSION="${{ inputs.python-version }}" just quality

    # diff-coverage compares coverage.xml against origin/main and requires ≥80%
    # coverage on *changed lines only*. Only meaningful on PRs — on main pushes
    # there is no diff to gate against.
    - name: Diff coverage gate
      if: ${{ inputs.run-diff-coverage == 'true' }}
      shell: bash
      run: PYTHON_VERSION="${{ inputs.python-version }}" just diff-coverage

    # ── Evals coverage measurement (transitional, non-blocking) ──────
    # Measures evals/ test coverage and checks for regressions against
    # quality/coverage_evals_baseline.json.  Currently informational only
    # (continue-on-error: true) while the evals coverage baseline stabilises.
    # TODO: promote to blocking once the evals coverage gate is stable.
    - name: Evals coverage measurement (informational)
      continue-on-error: true
      shell: bash
      run: |
        PYTHON_VERSION="${{ inputs.python-version }}" just test-evals-cov
        PYTHON_VERSION="${{ inputs.python-version }}" just eval-coverage-no-regression
